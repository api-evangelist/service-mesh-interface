# SMI HTTPRouteGroup — canonical example from spec.
# Source: https://github.com/servicemeshinterface/smi-spec/blob/main/apis/traffic-specs/v1alpha4/traffic-specs.md
apiVersion: specs.smi-spec.io/v1alpha4
kind: HTTPRouteGroup
metadata:
  name: the-routes
  namespace: default
spec:
  matches:
    - name: metrics
      pathRegex: "/metrics"
      methods:
        - GET
    - name: health
      pathRegex: "/ping"
      methods: ["*"]
    - name: android-insiders
      headers:
        user-agent: ".*Android.*"
        cookie: "^(.*?;)?(type=insider)(;.*)?$"
